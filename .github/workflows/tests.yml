name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # PPG-DaLiA is not available to CI, so the dataset-backed tests skip by design.
      # The decision-log guard and every synthetic test run here.
      - run: pytest -q
