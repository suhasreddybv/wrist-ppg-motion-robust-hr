# Blocks commits containing secrets, and pushes that fail the guard. One-time setup:
#   pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key
  # Refuses a push when the decision-log guard or any data-free test fails (the rule from
  # cgm-forecast-conformal, added here in Week 7). One-time setup: pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: guard-before-push
        name: decision-log guard and data-free tests
        entry: bash -c 'PY=$([ -x .venv/bin/python ] && echo .venv/bin/python || echo python3); PPG_DALIA_ROOT=/nonexistent "$PY" -m pytest -q -p no:cacheprovider'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
